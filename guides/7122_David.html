<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');
@font-face{font-family:'Oakes Grotesk';font-weight:400;font-style:normal;src:url('/assets/oakes-regular.woff2') format('woff2')}
@font-face{font-family:'Oakes Grotesk';font-weight:700;font-style:normal;src:url('/assets/oakes-regular.woff2') format('woff2')}
@font-face{font-family:'Oakes Grotesk';font-weight:400;font-style:italic;src:url('/assets/oakes-regular-italic.woff2') format('woff2')}

*{box-sizing:border-box;margin:0;padding:0}
.g{font-family:'Oakes Grotesk',sans-serif;background:#0d0d0d;color:#fff;max-width:680px;margin:0 auto;overflow:hidden}

.nav{display:flex;gap:6px;padding:14px 18px;background:#0d0d0d;border-bottom:1px solid #1e1e1e;flex-wrap:wrap}
.nav button{font-family:'Oakes Grotesk',sans-serif;font-size:10px;font-weight:500;letter-spacing:.06em;padding:5px 11px;border:1px solid #2a2a2a;background:transparent;color:#fff;border-radius:20px;cursor:pointer;transition:all .2s}
.nav button.on{background:#e8407a;border-color:#e8407a;color:#fff}
.nav button:hover:not(.on){border-color:#e8407a;color:#e8407a}

.slide{display:none;animation:fi .3s ease}
.slide.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* COVER — solid black */
.cover{background:#0d0d0d;padding:48px 36px 48px;min-height:520px;border-bottom:1px solid #1e1e1e}
.cover-logo{margin-bottom:52px}
.cover-eyebrow{font-size:14px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:22px}
.cover-name{font-family:'Instrument Serif',serif;font-size:42px;font-style:italic;line-height:1;color:#fff;margin-bottom:0}
.cover-name-rule{width:44px;height:1px;background:#e8407a;margin:14px 0 16px}
.cover-device{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#fff;margin-bottom:32px}
.cover-rule{border:none;border-top:1px solid #1e1e1e;margin:28px 0 22px}
.cover-inc-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin-bottom:16px}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:#fff}
.chk-dot{width:22px;height:22px;border-radius:50%;background:#e8407a;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk-dot svg{width:11px;height:11px}

/* INNER PAGES */
.pg{background:#0d0d0d;padding:32px 36px 40px}
.pg-label{font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:#e8407a;margin-bottom:8px}
.pg-title{font-family:'Oakes Grotesk',sans-serif;font-size:30px;line-height:1.1;color:#fff;margin-bottom:12px}
.pink-rule{border:none;border-top:1px solid #e8407a;margin:0 0 22px}
.rule{border:none;border-top:1px solid #1e1e1e;margin:22px 0}

/* SPEC TABLE */
.specs{width:100%;border-collapse:collapse;margin-bottom:22px}
.specs tr:nth-child(odd) td{background:#141414}
.specs td{padding:11px 12px;font-size:13px;border-bottom:1px solid #1e1e1e;color:#fff}
.specs td:first-child{font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#fff;width:36%}
.specs td:last-child{color:#fff}

/* SCIENCE */
.sci{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid #1e1e1e}
.sci:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.sci h3{font-family:'Oakes Grotesk',sans-serif;font-size:20px;font-weight:400;color:#fff;margin-bottom:8px}
.sci p{font-size:13px;line-height:1.7;color:#fff}

/* PROTOCOL CARDS */
.pc{background:#111;border:1px solid #222;border-radius:12px;padding:20px 20px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.pc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#e8407a;border-radius:0}
.pc-name{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#e8407a;margin-bottom:14px}
.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.pc-lbl{font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#fff;margin-bottom:3px}
.pc-val{font-size:13px;font-weight:500;color:#fff}
.pc-div{border:none;border-top:1px solid #1e1e1e;margin-bottom:12px}
.pc-note{font-size:13px;line-height:1.7;color:#fff}
.pc-tip{font-size:12px;color:#e8407a;font-weight:500;margin-top:8px}
.badge{display:inline-block;background:#1a0810;border:1px solid #3d1022;border-radius:20px;font-size:10px;font-weight:500;color:#e8407a;padding:4px 12px;margin-top:10px}

/* FAQS */
.faq{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #1e1e1e}
.faq:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.faq h3{font-family:'Oakes Grotesk',sans-serif;font-size:20px;font-weight:400;color:#fff;margin-bottom:8px}
.faq p{font-size:13px;line-height:1.7;color:#fff}

/* BENEFITS */
.ben{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}
.ben-lbl{font-size:13px;font-weight:600;color:#e8407a;min-width:126px;padding-top:2px}
.ben-txt{font-size:13px;line-height:1.7;color:#fff;flex:1}

/* REFS */
.ref{margin-bottom:14px;padding-left:16px;position:relative}
.ref::before{content:'•';position:absolute;left:0;top:1px;color:#e8407a;font-size:14px}
.ref-auth{font-size:13px;font-weight:600;color:#fff}
.ref-body{font-size:13px;line-height:1.7;color:#fff}

/* DISCLAIMER */
.disc-box{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:18px 20px;margin-bottom:24px}
.disc-box p{font-size:13px;line-height:1.7;color:#fff;margin-bottom:14px}
.disc-box p:last-child{margin-bottom:0}

/* CLOSING */
.closing{border-radius:12px;padding:36px 28px;text-align:center;background:linear-gradient(135deg,#8eb4e3,#9b4fbe,#cc3399,#f0508c,#f05a5a)}
.c-wm{font-size:20px;font-weight:500;letter-spacing:.14em;color:#fff;display:block;margin-bottom:20px}
.cpill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:7px 16px;font-size:12px;color:#fff;margin:4px}
.cdot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0}
.c-sign{font-size:11.5px;color:rgba(255,255,255,.75);max-width:380px;margin:16px auto 0;line-height:1.65}

@media(max-width:600px){
  .cover{padding:36px 20px}
  .cover-name{font-size:32px}
  .cover-eyebrow{font-size:11px}
  .cover-device{font-size:10px}
  .pg{padding:24px 20px 32px}
  .pg-title{font-size:22px}
  .sci h3,.faq h3{font-size:17px}
  .nav{padding:10px 12px;gap:5px}
  .nav button{font-size:9px;padding:4px 9px}
  .pc-grid{grid-template-columns:repeat(2,1fr)}
  .specs td{font-size:12px;padding:9px 10px}
  .ben{flex-direction:column;gap:4px}
  .ben-lbl{min-width:unset}
  .disc-box{padding:14px 16px}
}
</style>
